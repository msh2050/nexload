<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexLoad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      width: 280px;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    header {
      background: #181825;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #313244;
    }
    header h1 { font-size: 16px; font-weight: 700; }
    header .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #f38ba8;
      flex-shrink: 0;
    }
    header .dot.on { background: #a6e3a1; }

    .status {
      padding: 10px 16px;
      font-size: 12px;
      color: #a6adc8;
      border-bottom: 1px solid #313244;
    }

    .btn {
      display: block;
      width: calc(100% - 24px);
      margin: 10px 12px 4px;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #89b4fa;
      color: #1e1e2e;
    }
    .btn:hover { background: #74c7ec; }
    .btn.secondary {
      background: #313244;
      color: #cdd6f4;
      margin-top: 0;
    }
    .btn.secondary:hover { background: #45475a; }

    footer {
      padding: 8px 16px;
      font-size: 11px;
      color: #585b70;
      text-align: center;
    }
    footer a { color: #89b4fa; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>NexLoad</h1>
  </header>
  <p class="status" id="status">Checking connection…</p>

  <button class="btn" id="addBtn">+ Add Download</button>
  <button class="btn secondary" id="openBtn">Open NexLoad</button>

  <footer>
    <a href="https://github.com/msh2050/nexload" target="_blank">GitHub</a>
    &nbsp;·&nbsp; NexLoad v1.0
  </footer>

  <script src="popup.js"></script>
</body>
</html>
