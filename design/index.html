<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Nexload — Concepts</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --ui: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --serif: 'Instrument Serif', 'Times New Roman', serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--ui);
    background: #0a0a0c;
    color: #e8e8ea;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  * { box-sizing: border-box; }

  /* ── Shared aesthetic tokens ───────────────────────────── */
  .nx-dark {
    --bg-0: #07070a;
    --bg-1: #0d0d12;
    --bg-2: #14141c;
    --ink-0: #f4f4f7;
    --ink-1: #c9c9d1;
    --ink-2: #8a8a96;
    --ink-3: #5a5a66;
    --line: rgba(255,255,255,0.07);
    --line-2: rgba(255,255,255,0.12);
    --glass: rgba(20,20,28,0.55);
    --glass-strong: rgba(28,28,40,0.72);
    --teal: oklch(0.82 0.14 200);
    --teal-2: oklch(0.70 0.16 205);
    --violet: oklch(0.72 0.18 295);
    --violet-2: oklch(0.62 0.20 290);
    --warn: oklch(0.78 0.14 60);
    --good: oklch(0.78 0.16 150);
  }
  .nx-light {
    --bg-0: #f6f5f1;
    --bg-1: #ffffff;
    --bg-2: #ece9e2;
    --ink-0: #15151a;
    --ink-1: #3a3a44;
    --ink-2: #6a6a76;
    --ink-3: #9a9aa6;
    --line: rgba(0,0,0,0.06);
    --line-2: rgba(0,0,0,0.10);
    --glass: rgba(255,255,255,0.65);
    --glass-strong: rgba(255,255,255,0.82);
    --teal: oklch(0.55 0.12 200);
    --teal-2: oklch(0.50 0.14 210);
    --violet: oklch(0.55 0.18 295);
    --violet-2: oklch(0.48 0.20 290);
    --warn: oklch(0.65 0.14 60);
    --good: oklch(0.60 0.16 150);
  }

  /* gradient blobs behind glass */
  .nx-aurora {
    position: absolute; inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .nx-aurora::before, .nx-aurora::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
  }
  .nx-dark .nx-aurora::before {
    width: 540px; height: 540px;
    background: radial-gradient(circle, oklch(0.55 0.22 205) 0%, transparent 60%);
    top: -160px; left: -120px;
  }
  .nx-dark .nx-aurora::after {
    width: 620px; height: 620px;
    background: radial-gradient(circle, oklch(0.45 0.22 295) 0%, transparent 60%);
    bottom: -220px; right: -180px;
  }
  .nx-light .nx-aurora::before {
    width: 420px; height: 420px;
    background: radial-gradient(circle, oklch(0.82 0.10 205) 0%, transparent 60%);
    top: -120px; right: -80px;
    opacity: 0.7;
  }
  .nx-light .nx-aurora::after {
    width: 520px; height: 520px;
    background: radial-gradient(circle, oklch(0.85 0.08 60) 0%, transparent 60%);
    bottom: -200px; left: -120px;
    opacity: 0.6;
  }

  .glass {
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    border: 1px solid var(--line-2);
    border-radius: 18px;
  }

  /* Subtle film grain for cinematic feel */
  .nx-grain::after {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0.04;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
  }

  /* Liquid fill animation for progress bars */
  @keyframes nx-wave {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  @keyframes nx-pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  @keyframes nx-orbit {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes nx-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes nx-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes nx-twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* canvas root */
  #app { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screens-dashboard.jsx"></script>
<script type="text/babel" src="screens-widgets.jsx"></script>
<script type="text/babel" src="screens-states.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
